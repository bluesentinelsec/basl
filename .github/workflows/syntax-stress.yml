name: Syntax Stress

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: syntax-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-stress:
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl-dev libgles-dev libegl-dev libdbus-1-dev libudev-dev \
            libpipewire-0.3-dev libdecor-0-dev

      - name: Build Vigil
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVIGIL_BUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Run stress test suites (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python scripts/run_syntax_stress.py \
            --vigil-bin build/vigil \
            --suite-dir tests/compiler-syntax-stress \
            --suite-dir tests/stdlib-fmt-stress \
            --suite-dir tests/stdlib-math-stress \
            --suite-dir tests/stdlib-string-stress \
            --suite-dir tests/stdlib-array-stress \
            --suite-dir tests/stdlib-map-stress \
            --suite-dir tests/stdlib-fs-stress \
            --suite-dir tests/stdlib-args-stress \
            --suite-dir tests/stdlib-time-stress \
            --suite-dir tests/stdlib-json-stress \
            --suite-dir tests/stdlib-os-stress \
            --suite-dir tests/stdlib-regex-stress \
            --suite-dir tests/stdlib-csv-stress \
            --suite-dir tests/stdlib-yaml-stress \
            --suite-dir tests/stdlib-compress-stress \
            --suite-dir tests/stdlib-crypto-stress \
            --suite-dir tests/stdlib-xml-stress \
            --suite-dir tests/stdlib-encoding-stress \
            --suite-dir tests/stdlib-hash-stress \
            --suite-dir tests/stdlib-parse-stress \
            --suite-dir tests/stdlib-url-stress \
            --suite-dir tests/stdlib-random-stress \
            --suite-dir tests/stdlib-log-stress \
            --suite-dir tests/stdlib-reflect-stress \
            --work-dir ${{ runner.temp }}/syntax_stress \
            -j 4

      - name: Run stress test suites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/run_syntax_stress.py `
            --vigil-bin build/Release/vigil.exe `
            --suite-dir tests/compiler-syntax-stress `
            --suite-dir tests/stdlib-fmt-stress `
            --suite-dir tests/stdlib-math-stress `
            --suite-dir tests/stdlib-string-stress `
            --suite-dir tests/stdlib-array-stress `
            --suite-dir tests/stdlib-map-stress `
            --suite-dir tests/stdlib-fs-stress `
            --suite-dir tests/stdlib-args-stress `
            --suite-dir tests/stdlib-time-stress `
            --suite-dir tests/stdlib-json-stress `
            --suite-dir tests/stdlib-os-stress `
            --suite-dir tests/stdlib-regex-stress `
            --suite-dir tests/stdlib-csv-stress `
            --suite-dir tests/stdlib-yaml-stress `
            --suite-dir tests/stdlib-compress-stress `
            --suite-dir tests/stdlib-crypto-stress `
            --suite-dir tests/stdlib-xml-stress `
            --suite-dir tests/stdlib-encoding-stress `
            --suite-dir tests/stdlib-hash-stress `
            --suite-dir tests/stdlib-parse-stress `
            --suite-dir tests/stdlib-url-stress `
            --suite-dir tests/stdlib-random-stress `
            --suite-dir tests/stdlib-log-stress `
            --suite-dir tests/stdlib-reflect-stress `
            --work-dir "${{ runner.temp }}/syntax_stress" `
            -j 4
