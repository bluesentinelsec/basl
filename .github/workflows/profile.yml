name: Profile

on:
  push:
  workflow_dispatch:



jobs:
  linux-perf:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install profiling tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils graphviz linux-tools-common \
            linux-tools-$(uname -r) || true
          sudo apt-get install -y -qq \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl-dev libgles-dev libegl-dev libdbus-1-dev libudev-dev \
            libwayland-dev libdecor-0-dev wayland-protocols
          pip3 install gprof2dot
          git clone --depth 1 https://github.com/brendangregg/FlameGraph.git /opt/flamegraph

      - name: Allow perf events
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Build with profiling support
        run: |
          cmake -S . -B build-profile \
            -DVIGIL_BUILD_TESTS=OFF \
            -DVIGIL_PLUGIN_SDL=ON \
            -DVIGIL_OPCODE_PROFILE=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DVIGIL_LIBRARY_TYPE=STATIC \
            -DCMAKE_C_FLAGS="-fno-omit-frame-pointer -pg" \
            -DCMAKE_EXE_LINKER_FLAGS="-pg"
          cmake --build build-profile

      - name: Run profiler
        run: >
          python3 scripts/run_profile.py
          --vigil-bin $PWD/build-profile/vigil
          --manifest $PWD/benchmarks/manifest.json
          --output $PWD/profile-artifacts
          --flamegraph-dir /opt/flamegraph

      - name: Upload profile artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-results
          path: profile-artifacts/
