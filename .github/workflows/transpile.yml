name: Transpile Conformance

on:
  push:
  workflow_dispatch:

concurrency:
  group: transpile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transpile-conformance:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl-dev libgles-dev libegl-dev libdbus-1-dev libudev-dev \
            libpipewire-0.3-dev libdecor-0-dev

      - name: Build Vigil
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVIGIL_BUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Run transpile conformance suite
        run: |
          python3 scripts/run_transpile_conformance.py \
            --vigil-bin build/vigil \
            --suite transpile_conformance/ \
            --work-dir /tmp/transpile_conform
