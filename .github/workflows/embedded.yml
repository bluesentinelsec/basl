name: Embedded Sources

on:
  push:
  workflow_dispatch:

concurrency:
  group: embedded-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify embedded sources are up to date
        run: |
          python3 scripts/embed_plugin_sources.py \
            --root . \
            --output generated/embedded_sources.c \
            --check
